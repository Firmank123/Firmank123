name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 22 * * 1-5"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      # Maintenance fork of lowlighter/metrics.
      # Upstream last released v3.34 (Sept 2023) and its `habits` plugin crashes on
      # null entries in `payload.commits`; this fork fixes habits, activity and
      # achievements. Pin the SHA instead of @master if you want reproducibility:
      #   gh-metrics/metrics@b594ca3c0c5f4312f9674afb91ca8d7619f9c77d
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # ── Base ──────────────────────────────────────────────────────────────
          user: Firmank123
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          # `large` widens the canvas so multi-column sections have room to breathe
          config_display: large
          config_twemoji: yes
          # Section order (ids come from templates/classic/partials/_.json).
          # Anything omitted is appended afterwards in the default order.
          config_order: base.header, introduction, base.activity+community, base.repositories, isocalendar, languages, habits, lines, stargazers, topics, notable, achievements, people

          # ── Intro card ────────────────────────────────────────────────────────
          plugin_introduction: yes
          plugin_introduction_title: yes

          # ── Contribution calendar ─────────────────────────────────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ── Languages ─────────────────────────────────────────────────────────
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          # Clones and analyses every repo (accurate, but slow). Needs the
          # `metrics.run.git` extra, which the Docker image provides.
          # plugin_languages_indepth: yes

          # ── Coding habits ─────────────────────────────────────────────────────
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          # `graph` renders smooth d3 SVG charts instead of CSS div bars
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes
          plugin_habits_languages_limit: 8

          # ── Lines of code ─────────────────────────────────────────────────────
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4

          # ── Stargazers ────────────────────────────────────────────────────────
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph
          plugin_stargazers_days: 14

          # ── Topics ────────────────────────────────────────────────────────────
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_sort: stars
          plugin_topics_limit: 15

          # ── Notable contributions ─────────────────────────────────────────────
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue

          # ── Achievements ──────────────────────────────────────────────────────
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

          # ── Community ─────────────────────────────────────────────────────────
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 24
          plugin_people_size: 28

          # ── Optional extras ───────────────────────────────────────────────────
          # Recently starred repositories
          plugin_stars: yes
          plugin_stars_limit: 4
          repositories_forks: yes
